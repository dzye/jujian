<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/brand/icon-32.png"><title>句间 · 生词本</title><link rel="stylesheet" href="vendor/tom-select/tom-select.default.min.css"><link rel="stylesheet" href="vocabulary.css"></head>
<body><main>
<header><a class="brand" href="#"><img src="assets/brand/icon-128.png" width="36" height="36" alt=""><span>句间 <small>JUJIAN</small></span></a><span class="local-label">我的学习收藏 · 本机保存</span></header>
<section id="collection"><div class="page-heading"><div><p class="eyebrow">VOCABULARY</p><h1>生词本</h1><p id="count" class="meta"></p></div><div class="backup-actions"><div class="format-field"><label for="export-format">导出格式</label><select id="export-format"><option value="json">JSON 完整备份</option><option value="csv">CSV 表格</option></select></div><button id="export">导出</button><button id="import">导入备份</button><input type="file" id="import-file" accept=".json,.csv,application/json,text/csv" hidden></div></div>
<div class="filters"><div class="search-field"><label for="search">搜索词条</label><input id="search" placeholder="单词、释义或视频标题" aria-label="搜索"></div><div><label for="video-filter">来源视频</label><select id="video-filter"><option value="all">全部来源视频</option></select></div><div><label for="filter">学习状态</label><select id="filter"><option value="all">全部状态</option><option value="new">待学习</option><option value="learned">已掌握</option></select></div></div>
<div class="list-heading"><span id="result-count"></span><span>点击词条查看释义与视频来源</span></div><section id="list" aria-label="词条列表"></section><button id="more" hidden>显示更多</button><p class="backup-help">JSON 用于完整备份与恢复；CSV 用于表格查看。导入合并去重，保留已有备注和学习状态。</p></section>
<section id="detail" hidden aria-label="词条详情"></section><p id="notice" role="status" aria-live="polite"></p>
</main><script src="vendor/tom-select/tom-select.complete.min.js"></script><script src="vocabulary-backup.js"></script><script src="vocabulary.js"></script></body></html>
